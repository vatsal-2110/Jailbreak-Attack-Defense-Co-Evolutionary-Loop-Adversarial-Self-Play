# Default self-play experiment.
# Every model below is loaded from Hugging Face, one at a time.
# HF_TOKEN is only needed for gated repos. OPENROUTER_API_KEY is only
# needed if judge.model_id is changed to an API instruct model.

name: jailbreak_selfplay
output_root: runs
num_rounds: 4
seed: 4
openrouter_base_url: https://openrouter.ai/api/v1

defender:
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true
  max_seq_length: 1024
  max_new_tokens: 512
  generation_batch_size: 8
  trust_remote_code: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

redteam:
  # Local attacker. One <think>/<attack> sample per call.
  model_id: yukiyounai/Jailbreak-R1
  temperature: 1.0
  top_p: 0.95
  max_tokens: 4096
  retries: 4
  attacks_per_behavior: 3
  history_window: 10
  request_delay_s: 0.0
  load_in_4bit: true
  max_seq_length: 2048
  trust_remote_code: true

judge:
  # Successful attacks are labelled by the official HarmBench classifier
  # (Yes/No on the behaviour), loaded from Hugging Face. It is unloaded
  # before the defender or the refusal teacher is loaded.
  #
  #   cais/HarmBench-Mistral-7b-val-cls     local HF classifier (~7B, default)
  #   cais/HarmBench-Llama-2-13b-cls        local HF classifier (~13B)
  #   meta-llama/llama-3.3-70b-instruct     OpenRouter instruct, reply 0/1
  #
  # Do NOT put llama-guard-*, nemotron-*-content-safety, or
  # gpt-oss-safeguard-* here. They grade a generic harm taxonomy and emit
  # their own schema, which silently zeroed the original run.
  model_id: cais/HarmBench-Mistral-7b-val-cls
  temperature: 0.0
  max_tokens: 16
  retries: 4
  cases_per_request: 1
  load_in_4bit: true
  copyright_ngram_n: 20
  # Point at a directory of <behavior_id>.txt reference texts to score
  # copyright behaviours. Not distributed with this repo.
  copyright_reference_dir: null

safe_response:
  # Writes the refusal target for each attack the classifier marked successful.
  model_id: Qwen/Qwen3-4B-Instruct-2507
  temperature: 0.2
  top_p: 0.9
  max_tokens: 384
  load_in_4bit: true
  max_seq_length: 2048
  trust_remote_code: true

train:
  epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  logging_steps: 5
  save_strategy: "no"
  fp16: true
  optim: paged_adamw_8bit
  restart_policy: from_base    # from_base | incremental
  retention_ratio: 1.0

data:
  harmbench_csv: data/harmbench_behaviors_text_test.csv
  # "copyright" is excluded by default: without reference texts those
  # behaviours cannot be scored, and a safety judge always calls them safe.
  functional_categories:
    - standard
  num_train_behaviors: 5
  num_probe_behaviors: 5
  behavior_split_seed: 4
  retention_dataset: tatsu-lab/alpaca
  overrefusal_dataset: walledai/XSTest
