# Default self-play experiment.
# Secrets are read from the environment, never from this file:
#   OPENROUTER_API_KEY, HF_TOKEN

name: jailbreak_selfplay
output_root: runs
num_rounds: 4
seed: 4
openrouter_base_url: https://openrouter.ai/api/v1

defender:
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true
  max_seq_length: 1024
  max_new_tokens: 512
  generation_batch_size: 8
  trust_remote_code: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

redteam:
  model_id: nvidia/nemotron-3.5-lightning:free
  temperature: 1.1
  # Reasoning-tuned models spend part of the budget before emitting the JSON
  # array. Too low a limit truncates the array and the round is discarded.
  max_tokens: 3000
  retries: 4
  attacks_per_behavior: 3
  history_window: 10
  request_delay_s: 0.5

judge:
  # Switch judges by changing model_id:
  #   meta-llama/llama-3.3-70b-instruct     OpenRouter instruct (default)
  #   cais/HarmBench-Mistral-7b-val-cls     local HF classifier (~7B)
  #   cais/HarmBench-Llama-2-13b-cls        local HF classifier (~13B)
  #
  # Official HarmBench classifiers load from Hugging Face and use the
  # published Yes/No templates. They share the GPU with the defender;
  # load_in_4bit keeps that feasible.
  #
  # Do NOT put llama-guard-*, nemotron-*-content-safety, or
  # gpt-oss-safeguard-* here. They grade a generic harm taxonomy and emit
  # their own schema, which silently zeroed the original run.
  model_id: meta-llama/llama-3.3-70b-instruct
  temperature: 0.0
  max_tokens: 16
  retries: 4
  cases_per_request: 1
  load_in_4bit: true
  copyright_ngram_n: 20
  # Point at a directory of <behavior_id>.txt reference texts to score
  # copyright behaviours. Not distributed with this repo.
  copyright_reference_dir: null

train:
  epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  logging_steps: 5
  save_strategy: "no"
  fp16: true
  optim: paged_adamw_8bit
  restart_policy: from_base    # from_base | incremental
  retention_ratio: 1.0

data:
  harmbench_csv: data/harmbench_behaviors_text_test.csv
  # "copyright" is excluded by default: without reference texts those
  # behaviours cannot be scored, and a safety judge always calls them safe.
  functional_categories:
    - standard
    - contextual
  num_train_behaviors: 10
  num_probe_behaviors: 10
  behavior_split_seed: 4
  retention_dataset: tatsu-lab/alpaca
  overrefusal_dataset: walledai/XSTest
